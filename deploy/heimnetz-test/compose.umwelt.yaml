# Explicit opt-in only. Exactly two files, read-only; no parent directory mounts.
services:
  importer:
    extends:
      file: compose.yaml
      service: app
    profiles: [umwelt]
    command: ["python", "-m", "umwelt.cli", "watch", "--interval", "60"]
    healthcheck:
      disable: true
    volumes:
      - type: bind
        source: ${BL_WETTER_CSV:?Set explicit weather CSV path}
        target: /sources/wetter.csv
        read_only: true
      - type: bind
        source: ${BL_BODEN_CSV:?Set explicit soil CSV path}
        target: /sources/boden.csv
        read_only: true
