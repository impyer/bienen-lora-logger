name: stockkarte-fast
on:
  pull_request:
    paths:
      - 'prototype/claude-ui/**'
      - 'server/datenbank/**'
      - 'deploy/heimnetz-test/**'
      - 'tests/datenbank/test_stockkarte_api.py'
      - 'tests/datenbank/test_stockkarte_session.py'
      - 'tests/datenbank/test_stockkarte_persistenz.py'
      - 'tests/server/test_claude_ui.js'
      - 'tests/server/test_stockkarte_native.js'
      - 'tests/server/test_stockkarte_values.js'
      - 'tests/server/test_native_stockkarte_browser.js'
      - '.github/workflows/stockkarte.yml'
  workflow_dispatch:
concurrency:
  group: stockkarte-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  fachlogik:
    name: 'Stockkarte - Domain-Engine und Offline-Build'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Schema und Eingabewerte
        run: |
          node --check prototype/claude-ui/stockkarte_native.js
          node --check prototype/claude-ui/app.js
          node --check prototype/claude-ui/stockkarte_live.js
          node --check prototype/claude-ui/stockkarte_edit.js
          node tests/server/test_stockkarte_native.js
          node tests/server/test_stockkarte_values.js
          node tests/server/test_beep_catalog_adapter.js
          node tests/server/test_stockkarte_catalog_editor.js
      - name: Offline-HTML aus Quellen reproduzieren
        run: |
          python3 prototype/claude-ui/build_single.py
          git diff --exit-code -- prototype/claude-ui/bienenlogger-claude-prototyp.html
  bedienung:
    name: 'Stockkarte - Browser-Bedienabläufe ohne Pixel-Snapshots'
    needs: fachlogik
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Modulare Ansicht und Offline-Einzeldatei
        run: |
          node tests/server/test_claude_ui.js
          node tests/server/test_native_stockkarte_browser.js
          node tests/server/test_stockkarte_catalog_browser.js
          node tests/server/test_stockkarte_live_browser.js
  datenbank:
    name: 'Stockkarte - PostgreSQL 16 / Revisionen'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bienen_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testonly
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bienen_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BIENEN_TEST_DSN: 'host=127.0.0.1 port=5432 dbname=bienen_test user=postgres password=testonly'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Psycopg installieren
        run: python -m pip install 'psycopg[binary]>=3.2,<4' 'fastapi>=0.115,<1' 'httpx>=0.27,<1' 'argon2-cffi>=23,<26'
      - name: Additive Stockkartenmigration und Revisionsverhalten testen
        run: |
          python tests/datenbank/test_stockkarte_persistenz.py
          python tests/datenbank/test_stockkarte_api.py
          python tests/datenbank/test_stockkarte_session.py

  heimnetz_paket:
    name: 'Heimnetz - Compose, Image, isolierte Testdatenbank'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Synthetische Testkonfiguration erzeugen
        run: |
          cat > deploy/heimnetz-test/.env <<'EOF'
          LAN_BIND_IP=127.0.0.1
          LAN_ALLOWED_CIDR=172.16.0.0/12
          LAN_PORT=8443
          BL_DB_PASSWORD=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          BL_SESSION_SECRET=abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789
          EOF
          chmod 600 deploy/heimnetz-test/.env
      - name: Compose-Bereitstellung mit separaten Volumes validieren
        run: |
          docker compose --env-file deploy/heimnetz-test/.env -f deploy/heimnetz-test/compose.yaml config --quiet
          python3 - <<'PY'
          import yaml
          cfg=yaml.safe_load(open('deploy/heimnetz-test/compose.yaml'))
          assert 'ports' not in cfg['services']['db']
          assert 'ports' not in cfg['services']['app']
          assert cfg['networks']['internal']['internal'] is True
          assert 'ports' in cfg['services']['proxy']
          print('Separate Testdatenbank, interner Datenbank- und FastAPI-Zugang: PASS')
          PY
      - name: Python-Image aufbauen und eigene Testdatenbank starten
        run: |
          docker compose --env-file deploy/heimnetz-test/.env -f deploy/heimnetz-test/compose.yaml up -d --build db app
          docker compose --env-file deploy/heimnetz-test/.env -f deploy/heimnetz-test/compose.yaml exec -T app \
            python /srv/bienenlogger/server/datenbank/stockkarte_admin.py seed-demo
          docker compose --env-file deploy/heimnetz-test/.env -f deploy/heimnetz-test/compose.yaml exec -T db \
            psql -U bienenlogger -d bienenlogger_test -Atqc \
            'SELECT count(*) FROM bienen.sk_kategorie'
          docker compose --env-file deploy/heimnetz-test/.env -f deploy/heimnetz-test/compose.yaml exec -T app \
            python -c "import urllib.request; assert b'Claude' in urllib.request.urlopen('http://127.0.0.1:8765/').read()"
      - name: Fehlersuche bei Fehlschlag
        if: failure()
        run: |
          docker compose --env-file deploy/heimnetz-test/.env -f deploy/heimnetz-test/compose.yaml ps || true
          docker compose --env-file deploy/heimnetz-test/.env -f deploy/heimnetz-test/compose.yaml logs --tail=120 db app || true
      - name: Testcontainer ohne Volume-Löschung beenden
        if: always()
        run: docker compose --env-file deploy/heimnetz-test/.env -f deploy/heimnetz-test/compose.yaml down || true
