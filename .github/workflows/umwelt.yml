name: umwelt-r1
on:
  pull_request:
    paths:
      - 'server/datenbank/**'
      - 'prototype/claude-ui/**'
      - 'deploy/heimnetz-test/**'
      - 'tests/umwelt/**'
      - '.github/workflows/umwelt.yml'
      - '.dockerignore'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: umwelt-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  api-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_DB: bienen_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BIENEN_TEST_DSN: 'host=127.0.0.1 port=5432 dbname=bienen_test user=postgres password=synthetic-ci-only'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Locked application dependencies and real browser
        run: |
          python -m pip install -r server/datenbank/requirements.lock
          npm install --prefix "$RUNNER_TEMP/r1-tools" --no-save --package-lock=false playwright@1.56.1
          "$RUNNER_TEMP/r1-tools/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/r1-tools/node_modules" >> "$GITHUB_ENV"
          sudo apt-get update -q
          sudo apt-get install -y -q caddy postgresql-client
      - name: Reproduce vendored assets and offline preview
        run: |
          npm ci --prefix prototype/claude-ui --ignore-scripts --no-audit --no-fund
          npm run vendor --prefix prototype/claude-ui
          python prototype/claude-ui/build_single.py
          git diff --exit-code -- prototype/claude-ui/vendor prototype/claude-ui/bienenlogger-claude-prototyp.html
      - name: Parser, actual PostgreSQL transactions and authenticated API
        run: |
          python - <<'PY'
          import sys, unittest
          suite = unittest.defaultTestLoader.discover('tests/umwelt', pattern='test_*.py')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          # Keep fixture-only failures readable through the Checks API as well.
          for case, detail in result.failures + result.errors:
              message = (str(case) + '\n' + detail).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error title=Umwelt integration test::' + message, flush=True)
          sys.exit(0 if result.wasSuccessful() else 1)
          PY
      - name: Real Caddy HTTPS, CSV watcher, FastAPI, PostgreSQL and ECharts browser
        run: python tests/umwelt/e2e.py --output build/r1-e2e
      - name: Long windows, real paging, live CSV append and restricted importer
        run: python tests/umwelt/e2e.py --long-history --output build/r11-e2e
      - name: Synthetic yearly archive and bounded API resource profile
        run: python tests/umwelt/year_load.py --output build/r11-year
      - name: Synthetic evidence only; never upload private CA keys or credentials
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r1-synthetic-browser-evidence
          path: |
            build/r1-e2e/result.json
            build/r1-e2e/environment-mobile.png
            build/r1-e2e/browser.log
            build/r11-e2e/result.json
            build/r11-e2e/environment-mobile.png
            build/r11-e2e/browser.log
            build/r11-year/result.json
          if-no-files-found: warn
  container-restart:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: bienenlogger-r1-ci-r11
      R11_ARCHIVE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Private configuration for a fresh synthetic CI project
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os,secrets
          p=Path(os.environ['RUNNER_TEMP'])/'r1-compose.env'
          p.write_text('LAN_BIND_IP=127.0.0.1\nLAN_ALLOWED_CIDR=172.16.0.0/12\nLAN_PORT=19443\nBL_DB_PASSWORD='+secrets.token_hex(32)+'\nBL_SESSION_SECRET='+secrets.token_hex(32)+'\n')
          p.chmod(0o600)
          with open(os.environ['GITHUB_ENV'],'a') as f: f.write('R1_COMPOSE_ENV='+str(p)+'\n')
          PY
      - name: Build, restricted importer, two RO staging directories, restore and full restart
        run: bash tests/umwelt/test_compose.sh
      - name: Stop only this job's project; preserve volumes
        if: always()
        run: docker ps -q --filter label=com.docker.compose.project=bienenlogger-r1-ci-r11 | xargs --no-run-if-empty docker stop
