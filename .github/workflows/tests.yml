name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pc-tests:
    name: PC-Tests und Simulation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Kopien im Selbsttest-Ordner unverändert
        run: |
          cmp firmware/STM32_LORA_261008_ZS/beelogger_zeitsync.h tests/STM32_ZS_Selbsttest/beelogger_zeitsync.h
          cmp tests/zs_testfaelle.h  tests/STM32_ZS_Selbsttest/zs_testfaelle.h
          cmp tests/zs_testvektoren.h tests/STM32_ZS_Selbsttest/zs_testvektoren.h

      - name: Unit-Tests
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -O2 -o tests/host/test_zeitsync tests/host/test_zeitsync.cpp
          ./tests/host/test_zeitsync

      - name: Funkformat v2 (C gegen JavaScript-Referenz) und FFT
        run: |
          node tests/firmware/vektoren_v2.js > tests/firmware/ff2_vektoren.h
          g++ -std=c++11 -Wall -Wextra -Werror -O2 -o tests/firmware/test_funkformat_v2 tests/firmware/test_funkformat_v2.cpp
          ./tests/firmware/test_funkformat_v2
          g++ -std=c++11 -Wall -Wextra -Werror -O2 -o tests/firmware/test_bee_fft tests/firmware/test_bee_fft.cpp
          ./tests/firmware/test_bee_fft

      - name: Simulation 10 Logger, 30 Tage
        run: |
          g++ -std=c++17 -Wall -Wextra -O2 -DZEITSYNC_AKTIV=1 -o tests/sim/sim_sync tests/sim/sim_zeitsync.cpp
          g++ -std=c++17 -Wall -Wextra -O2 -DZEITSYNC_AKTIV=0 -o tests/sim/sim_orig tests/sim/sim_zeitsync.cpp
          ./tests/sim/sim_orig --tage 30
          ./tests/sim/sim_sync --tage 30 | tee sim.txt
          grep -q "verloren durch Kollision:  0 " sim.txt
          grep -q "veraltetem Datum (Schattenregister): 0" sim.txt

      - name: TTN-Auswertung mit simulierten Daten
        run: |
          ./tests/sim/sim_sync --tage 3 --csv sim.csv > /dev/null
          python3 tests/ttn_auswertung/test/testdaten_erzeugen.py sim.csv sim.json sim.ndjson
          python3 tests/ttn_auswertung/ttn_zeitanalyse.py sim.csv > /dev/null
          python3 tests/ttn_auswertung/ttn_zeitanalyse.py sim.json
          python3 tests/ttn_auswertung/ttn_zeitanalyse.py sim.ndjson > /dev/null

  formatter:
    name: TTN-Formatter (Node.js und goja)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Tests mit dem Quelltext
        run: VEKTOREN=vek_quelle.json node tests/formatter/test_formatter.js
      - name: Verkleinerte Fassung neu bauen und mit dem Repo vergleichen
        run: |
          sh formatter/bauen.sh
          git diff --exit-code formatter/ttn_formatter.min.js
      - name: Tests mit der verkleinerten Fassung
        run: VEKTOREN=vek_min.json node tests/formatter/test_formatter.js formatter/ttn_formatter.min.js
      - name: Wetterstation S2120 (Node.js)
        run: VEKTOREN=vek_s2120.json node tests/formatter/test_s2120_formatter.js
      - name: Gleiche Ergebnisse in goja (Laufzeit von The Things Stack)
        working-directory: tests/formatter/goja
        run: |
          go run . ../../../formatter/formatter.js ../../../vek_quelle.json
          go run . ../../../formatter/ttn_formatter.min.js ../../../vek_min.json
          go run . ../../../formatter/s2120_beep_formatter.js ../../../vek_s2120.json

  server:
    name: LoRa-Eingang (PHP, Ende-zu-Ende mit beelogger M.40)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP des Runners (mit curl)
        run: php -v && php -m | grep -qi '^curl$'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax
        run: for f in server/lora/*.php server/wetter/*.php $(find server/beelogger_eigen -name '*.php'); do php -l "$f" > /dev/null || exit 1; done
      - name: Eigene Server-Fassung aus dem Original-ZIP neu erzeugen und mit dem Repo vergleichen
        run: |
          T=$(mktemp -d) && unzip -q server/M40_261004_ServerSkripte.zip -d "$T/neu"
          python3 server/eigen_anpassen.py "$T/neu"
          diff -r -x beelogger_icons server/beelogger_eigen "$T/neu"
      - name: Unit-Tests
        run: |
          php tests/server/test_lora_funktionen.php
          php tests/server/test_wetter_funktionen.php
      - name: Wetter-Eingang Ende-zu-Ende
        run: bash tests/server/test_wetter_eingang.sh
      - name: Playwright mit Chromium für die Grafikprüfung (SRV26-08)
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Claude-basierter Bienenlogger-UI-Prototyp (Browser-Smoke-Test)
        run: |
          node --check prototype/claude-ui/app.js
          node tests/server/test_claude_ui.js
      - name: libfaketime für feste Serveruhr (CI26-01)
        run: sudo apt-get update -q && sudo apt-get install -y -q faketime
      # beelogger kürzt week.csv nur vor 08:00 Uhr Serverzeit. Beide Fälle fest prüfen, unabhängig von der Laufzeit der CI.
      - name: Ende-zu-Ende, eigene Fassung (UTC), Serveruhr 05:00 (Kürzung aktiv), Grafik im Browser verpflichtend
        run: SERVER_UHR="2026-10-09 05:00:00" BROWSER_PFLICHT=1 VARIANTE=eigen bash tests/server/test_lora_eingang.sh
      - name: Ende-zu-Ende, eigene Fassung (UTC), Serveruhr 14:00 (ohne Kürzung)
        if: ${{ !cancelled() }}
        run: SERVER_UHR="2026-10-09 14:00:00" BROWSER_PFLICHT=1 VARIANTE=eigen bash tests/server/test_lora_eingang.sh
      - name: Ende-zu-Ende, Original M.40 (Winterzeit-Fehler bleibt nachgewiesen), Serveruhr 05:00
        if: ${{ !cancelled() }}
        run: SERVER_UHR="2026-10-09 05:00:00" VARIANTE=original bash tests/server/test_lora_eingang.sh
      - name: Ende-zu-Ende, Original M.40, Serveruhr 14:00
        if: ${{ !cancelled() }}
        run: SERVER_UHR="2026-10-09 14:00:00" VARIANTE=original bash tests/server/test_lora_eingang.sh

  hardware-rechnungen:
    name: Hardware-Rechenmodelle (Energie, Mikrofonfilter, I²C, Funkmodul)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Energiebilanz
        run: python3 hardware/energiebilanz.py
      - name: Mikrofonfilter
        run: python3 hardware/mikrofon_filter.py
      - name: I²C-Leitung (Fehler, wenn das gewählte Kabel das 340-pF-Ziel verfehlt)
        run: python3 hardware/i2c_leitung.py
      - name: Funkmodul Ra-01SH (HF-Schalter-Logik, Funkstrecke; Fehler, wenn die Soll-Konfiguration nicht funktioniert)
        run: python3 hardware/funk_modell.py

  kicad-schaltplan:
    name: KiCad-10-Schaltpläne (Erzeugung reproduzierbar, ERC, Netzprüfungen)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: KiCad 10 aus der offiziellen PPA
        run: |
          sudo add-apt-repository -y ppa:kicad/kicad-10.0-releases
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends kicad kicad-symbols kicad-footprints
          kicad-cli version
          mkdir -p ~/.config/kicad/10.0
          cp /usr/share/kicad/template/sym-lib-table /usr/share/kicad/template/fp-lib-table ~/.config/kicad/10.0/
      - name: Erzeugen, ERC (alle Schweregrade gegen erc_erwartet.json), Netzprüfungen
        run: bash hardware/kicad/pruefen.sh
      - name: Eingecheckter Stand = erzeugter Stand (ohne PDF/Netzliste, die enthalten Datum)
        run: git diff --exit-code -- hardware/kicad ':!hardware/kicad/pdf' ':!hardware/kicad/netzliste'
      - name: Gegenprobe Reproduzierbarkeit (Zufalls-UUIDs müssen in jedem Blatt auffallen, SCH26-12)
        run: |
          bash hardware/kicad/pruefen.sh --gegenprobe
          git diff --exit-code -- hardware/kicad ':!hardware/kicad/pdf' ':!hardware/kicad/netzliste'

  windows-programme:
    name: Windows-Programme für die PC-Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: MinGW installieren
        run: sudo apt-get update -q && sudo apt-get install -y -q g++-mingw-w64-x86-64
      - name: Übersetzen
        run: |
          mkdir -p out
          x86_64-w64-mingw32-g++ -std=c++11 -O2 -static -o out/test_zeitsync.exe tests/host/test_zeitsync.cpp
          x86_64-w64-mingw32-g++ -std=c++17 -O2 -static -DZEITSYNC_AKTIV=1 -o out/sim_sync.exe tests/sim/sim_zeitsync.cpp
          x86_64-w64-mingw32-g++ -std=c++17 -O2 -static -DZEITSYNC_AKTIV=0 -o out/sim_orig.exe tests/sim/sim_zeitsync.cpp
          cp tests/windows/tests_starten.bat out/
      - uses: actions/upload-artifact@v4
        with:
          name: windows-tests
          path: out/

  firmware:
    name: Firmware übersetzen (BlackPill F411CE)
    runs-on: ubuntu-latest
    env:
      FQBN: STMicroelectronics:stm32:GenF4:pnum=BLACKPILL_F411CE,xserial=generic,usb=none,opt=osstd,rtlib=nano
      STM32_INDEX: https://github.com/stm32duino/BoardManagerFiles/raw/main/package_stmicroelectronics_index.json
    steps:
      - uses: actions/checkout@v4

      - name: arduino-cli installieren
        run: |
          mkdir -p $HOME/.local/bin
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | BINDIR=$HOME/.local/bin sh -s 1.1.1
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: STM32-Core 2.6.0
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls "$STM32_INDEX"
          arduino-cli core update-index
          arduino-cli core install STMicroelectronics:stm32@2.6.0

      - name: Bibliotheken
        run: |
          # --no-deps: sonst zieht "STM32duino Low Power" das neueste "STM32duino RTC" nach (2.0.0, braucht Core > 2.12)
          arduino-cli lib install --no-deps "MCCI LoRaWAN LMIC library@5.0.1" "STM32duino RTC@1.3.7" \
            "STM32duino Low Power@1.2.5" "OneWire@2.3.7" "HX711 Arduino Library@0.7.4"
          # beeloggerEE aus dem beelogger-Bibliothekspaket (wird nicht im Repo mitgeliefert)
          curl -fsSL -o bl_libs.zip "https://beelogger.de/?ddownload=200581"
          unzip -q bl_libs.zip -d bl_libs
          LIBDIR=$(arduino-cli config get directories.user)/libraries
          cp -r "$(find bl_libs -type d -name beelogger_EE | head -1)" "$LIBDIR/"
          # MCCI auf EU868 stellen
          CFG="$LIBDIR/MCCI_LoRaWAN_LMIC_library/project_config/lmic_project_config.h"
          sed -i 's|^//#define CFG_eu868 1|#define CFG_eu868 1|; s|^#define CFG_us915 1|//#define CFG_us915 1|' "$CFG"
          grep -n "CFG_eu868\|CFG_us915" "$CFG"

      - name: Logger-Sketch übersetzen
        run: |
          S=firmware/STM32_LORA_261008_ZS
          cp $S/Config_Geraet.beispiel.h $S/Config_Geraet.h
          echo "== Standard (Funkformat v2, ohne Mikrofon)"
          arduino-cli compile -b "$FQBN" --warnings all $S
          echo "== mit Mikrofon-FFT und 2 DS18B20"
          sed -i 's/^#define beelogger_Audio            0/#define beelogger_Audio            1/; s/^#define Anzahl_Sensoren_DS18B20 1/#define Anzahl_Sensoren_DS18B20 2/' $S/Config_MULTI.h
          arduino-cli compile -b "$FQBN" --warnings all $S
          echo "== beelogger-Format (FUNKFORMAT 1)"
          sed -i 's/^#define FUNKFORMAT                2/#define FUNKFORMAT                1/' $S/Config_LORA.h
          arduino-cli compile -b "$FQBN" --warnings all $S
          echo "== 3 Waagen mit Funkformat v2 muss abbrechen (#error)"
          sed -i 's/^#define FUNKFORMAT                1/#define FUNKFORMAT                2/' $S/Config_LORA.h
          sed -i 's/^#define Anzahl_Sensoren_Gewicht 1/#define Anzahl_Sensoren_Gewicht 3/' $S/Config_MULTI.h
          if arduino-cli compile -b "$FQBN" $S > fehler.log 2>&1; then echo "FEHLER: kein #error"; exit 1; fi
          grep -q "Funkformat v2 hat nur Gewicht1 und Gewicht2" fehler.log
          git checkout -- $S/Config_MULTI.h $S/Config_LORA.h

      - name: Selbsttest-Sketch übersetzen
        run: arduino-cli compile -b "$FQBN" --warnings all tests/STM32_ZS_Selbsttest
